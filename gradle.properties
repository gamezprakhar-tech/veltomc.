org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# =====================================================================================
# IMPORTANT - VERIFY BEFORE BUILDING
# 1.21.11 is a very recent release. The exact version strings below are my best current
# estimate, but Fabric's toolchain versions change often. Before running a build:
#   1. Go to https://fabricmc.net/develop/  (or https://fabricmc.net/develop/template/)
#   2. Select Minecraft version 1.21.11
#   3. Copy the exact yarn_mappings / loader_version / fabric_version it lists
#   4. Paste them in below, replacing my placeholders if they differ
# This takes 30 seconds and guarantees the project resolves correctly.
# =====================================================================================

# Minecraft / mappings / loader
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.14

# Fabric API
fabric_version=0.131.0+1.21.11

# Mod properties
mod_version=1.0.0
maven_group=com.veltomc
archives_base_name=veltomc
